<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Yann Faille</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Script model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>

  <!-- Icône burger -->
  <div id="burger">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Menu -->
  <nav id="main-nav">
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="archive.html">ARCHIVE</a></li>
      <li><a href="mailto:">CONTACT</a></li>
    </ul>
  </nav>

  <!-- Section modèle 3D -->
  <model-viewer
    src="spirale.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    tone-mapping="neutral"
    poster="poster.webp"
    shadow-intensity="1"
    style="width:100%; height:500px; background-color:#f0f0f0;">

    <div class="progress-bar hide" slot="progress-bar">
      <div class="update-bar"></div>
    </div>

    <button slot="ar-button" id="ar-button">
      View in your space
    </button>

    <div id="ar-prompt">
      <img src="https://modelviewer.dev/shared-assets/icons/hand.png" alt="AR prompt">
    </div>
  </model-viewer>

  <!-- Rebord gris avec bouton -->
  <div id="about-bar">
    <div class="about-content">
      <p class="bio">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Curabitur in felis sit amet risus cursus posuere.
        Nulla facilisi. Sed vitae est sit amet turpis pulvinar congue. Donec vitae mi at elit fermentum volutpat.
      </p>
      <button id="about-toggle">MORE ABOUT ME</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
